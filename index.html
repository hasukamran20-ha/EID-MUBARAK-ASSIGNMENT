<!DOCTYPE html>
<html>
<head>
    <title>Eid Mubarak</title>
    <style>
        body {
            background: #092b47;
            font-family: Georgia, serif;
        }

        .card {
            width: 600px;
            height: 360px;
            margin: 50px auto;
            background: linear-gradient(#061c35, #10446a);
            text-align: center;
            position: relative;
            overflow: hidden;
            color: white;
        }

 
        .mosque-pic {
        /* position: absolute; */
        bottom: 0;
         left: 0;
         width: 60%;
        height: 50%;
         object-fit: cover;
}
        .moon {
            position: absolute;
            top: 20px;
            left: 40px;
            font-size: 40px;
            color: #f7c56b;
        }

        .message {
            padding-top: 120px;
            text-align: center;
            font-size: 200px;
        }

        h1 {
            color: #f7bd62;
            font-size: 36px;
            font-style: italic;
        }

        h2 {
            font-size: 20px;
            font-style: italic;
            color:white
        }

        .mosque {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: white;
        }

        .dome {
            position: absolute;
            bottom: 60px;
            left: 220px;
            width: 160px;
            height: 80px;
            background: white;
            border-radius: 80px 80px 0 0;
        }

        .minaret {
            position: absolute;
            bottom: 60px;
            width: 25px;
            height: 100px;
            background: white;
        }

        .left {
            left: 100px;
        }

        .right {
            right: 100px;
        }
    </style>
</head>
<body>

            <div class="moon">☾</div>

        <div class="message">
            <h1>Chand Mubarak</h1>
            <h2>From Hasnain</h2>
        </div>

   <img src="./White Mosque Icon with Crescent.png" alt="Faisal Mosque" class="mosque-pic">
</body>
</html>
